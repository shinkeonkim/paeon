apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullnameOverride }}
  labels:
    app: {{ .Values.fullnameOverride }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.fullnameOverride }}
  template:
    metadata:
      labels:
        app: {{ .Values.fullnameOverride }}
    spec:
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          readinessProbe:
            httpGet:
              path: /
              port: 8000
              # kubelet은 파드 IP로 직접 요청하며 Host 헤더도 그 IP로 보낸다 —
              # ALLOWED_HOSTS에 없는 호스트라 지정 안 하면 Django가 400을 반환해
              # 계속 재시작에 빠진다(CrashLoopBackOff). 도메인으로 덮어써서 통과시킨다.
              httpHeaders:
                - name: Host
                  value: {{ .Values.domain | quote }}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
              httpHeaders:
                - name: Host
                  value: {{ .Values.domain | quote }}
            initialDelaySeconds: 15

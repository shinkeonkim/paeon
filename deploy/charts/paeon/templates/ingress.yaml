apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.fullnameOverride }}
  annotations:
    kubernetes.io/ingress.class: traefik
    # 실제 클러스터의 ClusterIssuer 이름은 letsencrypt-prod가 아니라 cloudflare-dns01이다
    # (kubectl get clusterissuer로 확인, 2026-08-28).
    cert-manager.io/cluster-issuer: cloudflare-dns01
spec:
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.fullnameOverride }}
                port:
                  number: 80
  tls:
    - hosts:
        - {{ .Values.domain | quote }}
      secretName: {{ .Values.fullnameOverride }}-tls
